[project]
name = "nexova-api"
version = "0.1.0"
description = "Centralized Nexova API: incident analysis and supplier directory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.6",
    "tinydb>=4.8",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-dotenv>=1.2.4",
    "resend>=2.49.1",
]

[project.scripts]
seed = "seed:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py", "config.py", "models.py", "user_models.py", "database.py", "security.py",
    "user_service.py", "email_service.py", "dependencies.py", "seed.py", "seed_data.py", "routes",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
